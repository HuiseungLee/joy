services:
  map:
    build: .
    container_name: map
    restart: unless-stopped
    user: "${MAP_UID:-1026}:${MAP_GID:-100}"
    env_file:
      - .env
    ports:
      - "127.0.0.1:${MAP_PORT:-7330}:8080"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      options:
        max-size: "10m"
        max-file: "3"
